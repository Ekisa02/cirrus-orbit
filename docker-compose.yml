version: '3.8'
services:
  orchestrator:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    depends_on:
      - worker1
      - worker2

  worker1:
    build: .
    command: uvicorn app.worker_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./:/workspace

  worker2:
    build: .
    command: uvicorn app.worker_api:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - ./:/workspace
